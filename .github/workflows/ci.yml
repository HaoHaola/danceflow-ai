name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: backend

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run API tests
        run: python -m pytest -m "not mysql"

  mysql:
    name: MySQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MYSQL_DATABASE: danceflow_ci_test
      MYSQL_HOST_PORT: '13309'
      MYSQL_USER: danceflow_ci

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: danceflow_ci_test
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: localhost
        ports:
          - '127.0.0.1:13309:3306'
        options: >-
          --health-cmd="mysqladmin ping --protocol=tcp --host=127.0.0.1 --silent"
          --health-interval=2s
          --health-timeout=3s
          --health-start-period=20s
          --health-retries=30

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Provision disposable test account
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          ci_mysql_password="$(openssl rand -hex 24)"
          printf '::add-mask::%s\n' "$ci_mysql_password"
          docker exec -i "$MYSQL_CONTAINER_ID" mysql --protocol=socket -uroot <<SQL
          CREATE USER '$MYSQL_USER'@'%' IDENTIFIED BY '$ci_mysql_password';
          GRANT ALL PRIVILEGES ON \`$MYSQL_DATABASE\`.* TO '$MYSQL_USER'@'%';
          SQL
          printf 'MYSQL_PASSWORD=%s\n' "$ci_mysql_password" >> "$GITHUB_ENV"
      - name: Apply and check migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Run MySQL tests and verify execution
        env:
          RUN_MYSQL_TESTS: '1'
        run: |
          report="$RUNNER_TEMP/mysql-tests.xml"
          python -m pytest -m mysql --junitxml="$report"
          python - "$report" <<'PY'
          import sys
          from xml.etree import ElementTree

          cases = ElementTree.parse(sys.argv[1]).findall(".//testcase")
          skipped = [case for case in cases if case.find("skipped") is not None]
          if not cases or skipped:
              raise SystemExit(
                  f"Expected MySQL tests to run without skips: "
                  f"{len(cases)} reported, {len(skipped)} skipped."
              )
          print(f"Verified {len(cases)} MySQL test cases ran without skips.")
          PY

  qdrant:
    name: Qdrant integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .

    services:
      qdrant:
        image: qdrant/qdrant:v1.16.3
        ports:
          - '127.0.0.1:6333:6333'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Qdrant test dependencies
        run: python -m pip install -r evaluations/rag/requirements-qdrant.txt 'pytest>=8.3,<10'
      - name: Wait for Qdrant
        run: curl -fsS --max-time 2 --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:6333/readyz
      - name: Run Qdrant tests and verify execution
        run: |
          report="$RUNNER_TEMP/qdrant-tests.xml"
          python -m pytest evaluations/rag/integration/test_qdrant_ingestion.py --junitxml="$report"
          python - "$report" <<'PY'
          import sys
          from xml.etree import ElementTree

          cases = ElementTree.parse(sys.argv[1]).findall(".//testcase")
          skipped = [case for case in cases if case.find("skipped") is not None]
          if not cases or skipped:
              raise SystemExit(
                  f"Expected Qdrant tests to run without skips: "
                  f"{len(cases)} reported, {len(skipped)} skipped."
              )
          print(f"Verified {len(cases)} Qdrant test cases ran without skips.")
          PY
